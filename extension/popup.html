<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Personal Mail MCP</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Proton Mail</h1><p class="sub">连接你的 Personal Mail MCP</p>
<label for="proton">浏览器中的 Proton 会话</label><select id="proton" disabled></select>
<p id="email">正在检测…</p><dl><dt>AUTH</dt><dd id="auth">待检测</dd><dt>Session-Id</dt><dd id="sessionId">待检测</dd><dt>REFRESH</dt><dd id="refresh">待检测</dd><dt>KeySalt</dt><dd id="salt">待检测</dd></dl>
<label for="account">导入到 MCP 账号</label><select id="account" disabled></select>
<button id="login" type="button">打开 MCP 管理页 / 登录 Access</button>
<button id="detect" type="button">重新检测</button>
<p class="notice">点击连接会把同一 UID 的结构化 AUTH / REFRESH / Session-Id Cookie 与 KeySalt 组成 Browser Session Bundle v2，发送到 <strong>mail.mcp.happyfirst.top</strong>。KeySalt 通过 account.proton.me 同源请求自动重放获取；扩展不读取密码，也不保存会话副本。</p>
<button id="connect" type="button" disabled>一键连接 Personal Mail MCP</button>
<p id="status" role="status" aria-live="polite"></p><script type="module" src="popup.js"></script></body></html>
